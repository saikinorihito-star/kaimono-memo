<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="買い物メモ">
<title>買い忘れ防止メモ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#182622;background:#f5f7f6;font-size:16px}*{box-sizing:border-box}body{margin:0}.wrap{max-width:520px;margin:auto;padding:26px 16px max(36px,env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:26px;letter-spacing:-.04em;margin:0}header p{color:#688077;font-size:13px;margin:7px 0 0}.mark{background:#dcefe6;border-radius:16px;padding:12px;font-size:22px}.card{background:#fff;border:1px solid #e6ece8;border-radius:18px;padding:16px;box-shadow:0 6px 22px rgba(22,60,44,.035);margin:14px 0}.fieldrow{display:flex;gap:9px}.fieldrow input{flex:1;min-width:0}input,select,button{font:inherit}input,select{border:1px solid #dce5df;border-radius:12px;padding:13px 12px;background:white;min-height:48px}input:focus,select:focus{outline:2px solid #87bca3;outline-offset:1px}button{border:0;border-radius:12px;min-height:46px;padding:10px 15px;background:#176943;color:white;font-weight:700;cursor:pointer}button:active{transform:scale(.98)}button.secondary{color:#236649;background:#eaf5ee}button.ghost{background:transparent;color:#416c56;padding:7px 9px;min-height:36px}button.danger{background:#fff0ee;color:#a03b2e}button:disabled{opacity:.4;cursor:default}.selectrow{display:flex;gap:8px;margin-top:9px}.selectrow select{width:100%}.headrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}h2{font-size:17px;margin:0}.sub{font-size:12px;color:#718178}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.tab{background:#edf3ee;color:#537060;border:0;border-radius:40px;font-size:13px;min-height:38px;white-space:nowrap;padding:8px 13px}.tab.active{background:#176943;color:white}.entry{display:flex;align-items:center;gap:10px;min-height:57px;border-top:1px solid #eff2ef;padding:6px 0}.entry:first-child{border-top:0}.check{width:27px;height:27px;accent-color:#176943;flex-shrink:0}.entry-main{flex:1;min-width:0}.entry-name{font-size:16px;overflow-wrap:anywhere}.entry-name.done{text-decoration:line-through;color:#98a79f}.entry-tag{display:block;font-size:11px;color:#899b90;margin-top:3px}.mini{border:0;background:transparent;color:#819087;min-height:40px;min-width:40px;padding:5px;font-size:21px;font-weight:400}.empty{font-size:14px;color:#8c9c92;text-align:center;padding:25px 0}.progress{background:#e9f0ea;height:8px;border-radius:6px;overflow:hidden;margin:14px 0 7px}.bar{height:100%;background:#3f9c72;transition:width .2s}.counts{font-size:13px;color:#6a8074}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.buttons button{font-size:13px;min-height:40px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:5px;border:1px solid #d9e8dc;border-radius:30px;padding:6px 6px 6px 12px;background:#f7fbf8}.chip button.add{background:none;color:#245f42;padding:0;min-height:29px;font-size:13px}.chip button.remove{background:none;color:#9cad9f;padding:0 5px;min-height:29px;font-size:18px;font-weight:400}.savehint{color:#74867c;font-size:12px;line-height:1.6;margin-top:10px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.small{font-size:13px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#203c2e;color:white;border-radius:24px;padding:12px 18px;white-space:nowrap;box-shadow:0 8px 30px #0002;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}footer{font-size:12px;color:#748579;margin:20px 2px;line-height:1.6}
</style></head><body>
<div class="wrap">
<header><div><h1>買い物メモ</h1><p>必要なものを、忘れずに。</p></div><div class="mark" aria-hidden="true">🛒</div></header>
<section class="card"><form id="add-form"><div class="fieldrow"><input id="name" aria-label="買うもの" placeholder="買うものを入力（例：牛乳）" autocomplete="off" maxlength="60" required><button type="submit">追加</button></div><div class="selectrow"><select id="store" aria-label="買い物先"><option>スーパー</option><option>ドラッグストア</option><option>コンビニ</option><option>その他</option></select></div></form></section>
<section class="card"><div class="headrow"><h2>買い物リスト</h2><span class="counts" id="count"></span></div><div class="tabs" id="tabs" aria-label="買い物先の絞り込み"></div><div id="items" aria-live="polite"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="counts" id="status"></div><div class="buttons"><button type="button" id="remove-done" class="secondary">✓ 購入済みを削除</button><button type="button" id="clear-all" class="danger">すべて削除</button></div></section>
<section class="card"><div class="headrow"><h2>よく買うもの</h2><span class="sub">タップでリストに追加</span></div><div id="favorites" class="chips"></div><div class="buttons"><button type="button" class="secondary" id="favorite-from-list">リストから定番に登録</button></div><p class="savehint">商品をリストに追加すると、その商品が定番候補として表示されます。不要な定番は × で削除できます。</p></section>
<footer>このアプリのデータは使用しているブラウザ内に保存されます。アカウント登録不要。端末間の同期や自動バックアップはありません。Safariのデータを消去するとリストも消える場合があります。</footer>
</div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const KEY='kaimono-memo-v1';const stores=['すべて','スーパー','ドラッグストア','コンビニ','その他'];let model={items:[],favorites:[],filter:'すべて'};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.items)&&Array.isArray(saved.favorites)){model={...model,items:saved.items.filter(x=>x&&typeof x.name==='string'),favorites:saved.favorites.filter(x=>x&&typeof x.name==='string')};}}catch(e){}
const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({items:model.items,favorites:model.favorites}));}catch(e){message('保存できませんでした。ブラウザ設定をご確認ください');}};
let toastTimer;function message(str){$('toast').textContent=str;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2000)}
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
function add(name,store){name=name.trim();if(!name)return;const found=model.items.find(x=>x.name.toLocaleLowerCase('ja')===name.toLocaleLowerCase('ja')&&x.store===store);if(found){if(found.done){found.done=false;save();render();message('リストに戻しました')}else message('すでにリストにあります');return}model.items.unshift({id:id(),name,store,done:false});save();render();message('追加しました')}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){const tabs=$('tabs');tabs.replaceChildren();stores.forEach(s=>{let b=el('button','tab'+(model.filter===s?' active':''),s);b.type='button';b.onclick=()=>{model.filter=s;render()};tabs.append(b)});
const visible=model.items.filter(x=>model.filter==='すべて'||x.store===model.filter);$('items').replaceChildren();if(!visible.length){$('items').append(el('div','empty','まだ商品がありません。上から追加してください。'))}else{visible.slice().sort((a,b)=>Number(a.done)-Number(b.done)).forEach(item=>{const row=el('div','entry');const check=el('input','check');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label',item.name+' を購入済みにする');check.onchange=()=>{item.done=check.checked;save();render()};const body=el('div','entry-main');body.append(el('div','entry-name'+(item.done?' done':''),item.name));body.append(el('span','entry-tag',item.store));let rem=el('button','mini','×');rem.type='button';rem.setAttribute('aria-label',item.name+'を削除');rem.onclick=()=>{model.items=model.items.filter(x=>x.id!==item.id);save();render()};row.append(check,body,rem);$('items').append(row)})}
const all=model.items.length,done=model.items.filter(x=>x.done).length;$('count').textContent=all+'件';$('status').textContent=all?`${done} / ${all} 件 購入済み`:'買うものを追加しましょう';$('bar').style.width=(all?done/all*100:0)+'%';$('remove-done').disabled=!done;$('clear-all').disabled=!all;
const fav=$('favorites');fav.replaceChildren();if(!model.favorites.length){fav.append(el('div','empty','まだ定番商品がありません'))}else{model.favorites.forEach(x=>{const chip=el('div','chip');const addBtn=el('button','add','＋ '+x.name);addBtn.type='button';addBtn.title=x.store;addBtn.onclick=()=>{add(x.name,x.store);};const remove=el('button','remove','×');remove.type='button';remove.setAttribute('aria-label',x.name+'を定番から削除');remove.onclick=()=>{model.favorites=model.favorites.filter(f=>f.id!==x.id);save();render()};chip.append(addBtn,remove);fav.append(chip)})}}
$('add-form').onsubmit=e=>{e.preventDefault();add($('name').value,$('store').value);$('name').value='';$('name').focus()};
$('remove-done').onclick=()=>{model.items=model.items.filter(x=>!x.done);save();render();message('購入済みを削除しました')};
$('clear-all').onclick=()=>{if(!confirm('買い物リストをすべて削除しますか？（定番商品は残ります）'))return;model.items=[];save();render();message('リストを削除しました')};
$('favorite-from-list').onclick=()=>{let count=0;for(const x of model.items){if(!model.favorites.some(f=>f.name===x.name&&f.store===x.store)){model.favorites.push({id:id(),name:x.name,store:x.store});count++}}save();render();message(count?count+'件を定番に登録しました':'新しい商品はありません')};
render();})();
</script></body></html>
